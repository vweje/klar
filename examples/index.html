  <title>Klar - demo</title>
  <meta name="description" content="Klar is a sharp, monochrome design system for React: tokens, components and themes for Tailwind and shadcn/ui.">
  <script>
    // Apply the saved theme before first paint so the demo never flashes the wrong one.

  <style>
    html, body { height: 100%; }
    #root { height: 100%; }
    .app { position: relative; display: flex; height: 100%; min-height: 640px; overflow: hidden; }
    .app .k-sidebar { flex: none; height: 100%; }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .content { flex: 1; overflow: auto; padding: var(--space-8); }
    .inner { display: flex; flex-direction: column; gap: var(--space-6); }
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
    .head h1 { margin: 0; }
    .head p { margin: 4px 0 0; color: var(--text-secondary); }
    .actions { display: flex; align-items: center; gap: var(--space-2); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-3); }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-3); flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: var(--radius-sm); background: var(--primary); color: var(--on-primary); font-weight: 800; font-size: 13px; }
    .logo span { font-weight: 800; font-size: 15px; letter-spacing: -0.02em; }
    .me { display: flex; align-items: center; gap: 10px; padding: 4px; font-weight: 700; }
    .me small { display: block; font-weight: 500; font-size: 12px; color: var(--text-secondary); }
    .person { display: inline-flex; align-items: center; gap: 8px; }
    .hint { font-size: 12px; color: var(--text-muted); }

    /* Settings: NavList on the left, one page at a time on the right */
    .settings { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--space-12); align-items: start; }
    .settings > .k-navlist { position: sticky; top: 0; }
    .settings__page { display: flex; flex-direction: column; gap: var(--space-6); min-width: 0; animation: k-reveal var(--duration-base) var(--ease-out); }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; padding-bottom: var(--space-6); border-bottom: 1px solid var(--border); }
    .page-head h2 { margin: 0; }
    .page-head p { margin: 4px 0 0; color: var(--text-secondary); }
    .set-narrow { width: 320px; max-width: 100%; }
    .set-pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); align-self: stretch; }
    .set-profile { display: flex; align-items: center; gap: var(--space-4); }
    .set-profile strong { display: block; font-size: 15px; }
    .set-profile span { color: var(--text-secondary); }

    /* Task screen inside the modal: content on the left, details on the right */
    .task { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--space-8); }
    .task__main { display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }
    .task__main .k-textarea { min-height: 220px; }
    .task__side { display: flex; flex-direction: column; gap: var(--space-5); padding-left: var(--space-8); border-left: 1px solid var(--border); }

    @media (max-width: 860px) {
      .app .k-sidebar { display: none; }
      .content { padding: var(--space-6); }
      .settings { grid-template-columns: 1fr; gap: var(--space-6); }
      .settings > .k-navlist { position: static; }
      .set-pair { grid-template-columns: 1fr; }
      .task { grid-template-columns: 1fr; }
      .task__side { padding-left: 0; border-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .settings__page { animation: none; } }
  </style>
</head>

      var emailError = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.value.email) ? undefined : 'Enter a valid email address';
      return h(React.Fragment, null,
        h(PageHead, { page: 'profile', actions: h(SaveActions, { dirty: d.dirty, invalid: !!emailError, onDiscard: d.reset, onSave: function () { p.onSaveProfile(d.value); K.toast.success('Profile saved'); } }) }),
        h('div', null,
          h(K.SettingsSection, { title: 'Photo', description: 'Shown next to your name across the workspace.' },
            h('div', { className: 'set-profile' },
              h(K.Avatar, { name: d.value.name || '?', size: 'lg' }),
              h('div', null, h('strong', null, d.value.name || 'No name'), h('span', null, d.value.title || 'No title')),
              h(K.Button, { size: 'sm', variant: 'secondary', icon: 'upload', onClick: function () { K.toast('Photo upload is not part of the demo'); } }, 'Change photo'))),
          h(K.SettingsSection, { title: 'Name and title', description: 'Use the name your team knows you by.' },
            h('div', { className: 'set-pair' },
              h(K.TextField, { label: 'Name', value: d.value.name, onChange: d.set('name') }),
              h(K.TextField, { label: 'Job title', value: d.value.title, onChange: d.set('title') }))),
          h(K.SettingsSection, { title: 'Email address', description: 'Used for sign-in and notifications.' },
            h(K.TextField, { 'aria-label': 'Email address', type: 'email', value: d.value.email, onChange: d.set('email'), error: emailError }))));
    }

    function SecurityPage(p) {
      return h(React.Fragment, null,
        h(PageHead, { page: 'security' }),
        h('div', null,
          h(K.SettingsSection, { title: 'Two-factor authentication', description: 'A code from your authenticator app every time you sign in.' },
            h(K.Switch, { label: 'Ask for a code when I sign in', checked: p.prefs.twoFactor, onChange: function (on) { p.onPref('twoFactor', on); } })),
          h(K.SettingsSection, { title: 'Password', description: 'Last changed 3 months ago.' },
            h(K.Button, { variant: 'secondary', icon: 'lock', onClick: function () { K.toast('Password change is not part of the demo'); } }, 'Change password')),
          h(K.SettingsSection, { title: 'Active sessions', description: 'Devices that are signed in to your account.' },
            h(K.List, null,
              h(K.ListRow, { icon: 'home', title: 'Chrome on Windows', subtitle: 'Copenhagen · This device', value: h(K.Badge, null, 'Current') }),
              h(K.ListRow, { icon: 'person', title: 'Safari on iPhone', subtitle: 'Aarhus · 2 hours ago', accessory: h(K.Button, { size: 'sm', variant: 'secondary', onClick: function () { K.toast.success('Signed out of Safari on iPhone'); } }, 'Sign out') })))));
    }

    function AppearancePage(p) {
      return h(React.Fragment, null,
        h(PageHead, { page: 'appearance' }),
        h('div', null,
          h(K.SettingsSection, { title: 'Theme', description: 'System follows your operating system.' },
            h(K.SegmentedControl, { 'aria-label': 'Theme', value: p.theme, onChange: p.onTheme, options: [
              { value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }, { value: 'system', label: 'System' }] })),
          h(K.SettingsSection, { title: 'Start page', description: 'The page Klar opens on.' },
            h(K.Dropdown, { 'aria-label': 'Start page', value: p.prefs.startPage, onChange: function (v) { p.onPref('startPage', v); }, className: 'set-narrow', options: [
              { value: 'home', label: 'Overview', icon: 'home' }, { value: 'inbox', label: 'Inbox', icon: 'inbox' }, { value: 'cal', label: 'Calendar', icon: 'calendar' }] }))));
    }

    function LanguagePage(p) {
      return h(React.Fragment, null,
        h(PageHead, { page: 'language' }),
        h('div', null,
          h(K.SettingsSection, { title: 'Language', description: 'Used for built-in texts like search, close and pagination.' },
            h(K.Dropdown, { 'aria-label': 'Language', value: p.lang, onChange: p.onLang, className: 'set-narrow', options: [
              { value: 'en', label: 'English', description: 'Search, Close, Previous' }, { value: 'da', label: 'Dansk', description: 'Søg, Luk, Forrige' }] })),
          h(K.SettingsSection, { title: 'Date format', description: 'How dates are written across the workspace.' },
            h(K.RadioGroup, { 'aria-label': 'Date format', value: p.prefs.dateFormat, onChange: function (v) { p.onPref('dateFormat', v); }, options: ['Nov 1, 2026', '01/11/2026', '2026-11-01'] })),
          h(K.SettingsSection, { title: 'First day of the week', description: 'Used by the calendar and date pickers.' },
            h(K.SegmentedControl, { 'aria-label': 'First day of the week', value: p.prefs.weekStart, onChange: function (v) { p.onPref('weekStart', v); }, options: ['Monday', 'Sunday'] }))));
    }

    function NotificationsPage(p) {
      return h(React.Fragment, null,
        h(PageHead, { page: 'notifications' }),
        h('div', null,
          h(K.SettingsSection, { title: 'Email', description: 'What lands in your inbox.' },
            h(K.List, null, emailNotifications.map(function (n) {
              return h(K.ListRow, { key: n.id, title: n.title, subtitle: n.subtitle, accessory: h(K.Switch, { 'aria-label': n.title, checked: p.prefs[n.id], onChange: function (on) { p.onPref(n.id, on); } }) });
            }))),
          h(K.SettingsSection, { title: 'Desktop', description: 'While Klar is open in a browser tab.' },
            h(K.Switch, { label: 'Show desktop notifications', checked: p.prefs.desktop, onChange: function (on) { p.onPref('desktop', on); } }),
            h(K.Switch, { label: 'Play a sound', checked: p.prefs.sound, disabled: !p.prefs.desktop, onChange: function (on) { p.onPref('sound', on); } }))));
    }

    function GeneralPage(p) {
      var d = useDraft(p.workspace);
      var urlError = /^[a-z0-9-]+$/.test(d.value.url) ? undefined : 'Use only lowercase letters, numbers and dashes';
      return h(React.Fragment, null,
        h(PageHead, { page: 'general', actions: h(SaveActions, { dirty: d.dirty, invalid: !d.value.name.trim() || !!urlError, onDiscard: d.reset, onSave: function () { p.onSaveWorkspace(d.value); K.toast.success('Workspace saved'); } }) }),
        h('div', null,
          h(K.SettingsSection, { title: 'Workspace name', description: 'Shown in the sidebar and in emails.' },
            h(K.TextField, { 'aria-label': 'Workspace name', value: d.value.name, onChange: d.set('name') })),
          h(K.SettingsSection, { title: 'Workspace URL', description: 'Where your team finds the workspace.' },
            h(K.TextField, { 'aria-label': 'Workspace URL', value: d.value.url, onChange: d.set('url'), error: urlError, hint: urlError ? undefined : 'klar.app/' + d.value.url }))));
    }

    function memberMenu(m) {
      return [
        { label: 'Role', icon: 'person', items: ['Owner', 'Admin', 'Member'].map(function (r) { return { label: r, checked: m.role === r, onSelect: function () { K.toast.success(people[m.id] + ' is now ' + r); } }; }) },
        { separator: true },
        { label: 'Remove from workspace', icon: 'trash', danger: true, disabled: m.role === 'Owner', onSelect: function () { K.toast(people[m.id] + ' was removed'); } }];
    }

    function MembersPage() {
      return h(React.Fragment, null,
        h(PageHead, { page: 'members', actions: h(K.Button, { icon: 'plus', onClick: function () { K.toast.success('Invite link copied'); } }, 'Invite people') }),
        h(K.Table, { rows: members, rowMenu: memberMenu, columns: [
          { key: 'name', label: 'Name', strong: true, render: function (m) { return h('span', { className: 'person' }, h(K.Avatar, { name: people[m.id], size: 'sm' }), people[m.id]); } },
          { key: 'email', label: 'Email' },
          { key: 'role', label: 'Role' },
          { key: 'status', label: 'Status', render: function (m) { return h(K.Badge, { tone: m.status === 'Active' ? 'success' : 'warning' }, m.status); } },
          { key: 'menu', label: '', width: 48, align: 'right', render: function (m) {
            return h(K.Menu, { align: 'end', items: memberMenu(m), trigger: h(K.Button, { size: 'sm', variant: 'ghost', icon: 'more', 'aria-label': 'Actions for ' + people[m.id] }) });
          } }] }));
    }

    function DeletePage(p) {
      var open = React.useState(false);
      return h(React.Fragment, null,
        h(PageHead, { page: 'delete' }),
        h('div', null,
          h(K.SettingsSection, { title: 'Delete this workspace', description: 'Removes ' + p.workspace.name + ', its 3 projects and every task for everyone. This cannot be undone.' },
            h(K.Button, { variant: 'danger', icon: 'trash', onClick: function () { open[1](true); } }, 'Delete workspace'))),
        h(K.Dialog, { overlay: true, open: open[0], onClose: function () { open[1](false); }, title: 'Delete ' + p.workspace.name + '?', message: 'The workspace and its 3 projects will be permanently deleted for everyone.', actions: [
          { label: 'Cancel', variant: 'secondary', onClick: function () { open[1](false); } },
          { label: 'Delete workspace', variant: 'danger', onClick: function () { open[1](false); K.toast({ title: 'Workspace deleted', description: 'This is a demo, so nothing was removed.' }); } }] }));
    }

    var settingsPageComponents = { profile: ProfilePage, security: SecurityPage, appearance: AppearancePage, language: LanguagePage, notifications: NotificationsPage, general: GeneralPage, members: MembersPage, 'delete': DeletePage };

    function Settings(p) {
      return h('div', { className: 'inner' },
        h('div', { className: 'head' },
          h('div', null, h('h1', { className: 'k-h1' }, 'Settings'), h('p', null, 'Your account, your preferences and the workspace.'))),
        h('div', { className: 'settings' },
          h(K.NavList, { 'aria-label': 'Settings', items: settingsNav, value: p.page, onChange: p.onPage }),
          h('div', { key: p.page, className: 'settings__page' }, h(settingsPageComponents[p.page], p))));
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
