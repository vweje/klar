  <script>
    // Apply the saved theme before first paint so the page never flashes the wrong one.

  <style>
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    .top { position: sticky; top: 0; z-index: 40; border-bottom: 1px solid var(--border); background: var(--canvas); }
    .top__inner { display: flex; align-items: center; gap: var(--space-5); max-width: 1240px; height: 56px; margin: 0 auto; padding: 0 var(--space-6); }
    .logo { display: flex; align-items: center; gap: 10px; margin-right: auto; font-size: 15px; font-weight: 800; letter-spacing: -0.02em; text-decoration: none; color: var(--text); }
    .logo b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: var(--radius-sm); background: var(--primary); color: var(--on-primary); font-size: 12px; }
    .top a:not(.logo) { font-size: 13px; font-weight: 700; color: var(--text-secondary); text-decoration: none; transition: color var(--duration-fast) var(--ease-out); }
    .top a:not(.logo):hover { color: var(--text); }
    .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--space-12); max-width: 1240px; margin: 0 auto; padding: var(--space-8) var(--space-6) 96px; }
    .toc { position: sticky; top: 88px; align-self: start; max-height: calc(100vh - 112px); overflow-y: auto; }
    .intro h1 { margin: 0; }
    .intro p { max-width: 560px; margin: var(--space-2) 0 0; color: var(--text-secondary); }
    .group { margin: var(--space-16) 0 0; }
    .comp { padding: var(--space-8) 0; border-top: 1px solid var(--border); scroll-margin-top: 72px; }
    .comp__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4); }
    .comp__head h3 { margin: 0; }
    .comp__head a { flex: none; font-size: 13px; font-weight: 700; color: var(--text-secondary); text-decoration: none; }
    .comp__head a:hover { color: var(--text); }
    .comp > p { max-width: 640px; margin: 4px 0 0; color: var(--text-secondary); }
    .stage { display: flex; flex-direction: column; gap: var(--space-4); margin-top: var(--space-4); padding: var(--space-6); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
    .stage--canvas { background: var(--canvas); }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
    .row--top { align-items: flex-start; }
    .narrow { max-width: 360px; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-4); }
    .icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--space-2); }
    .icons span { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: var(--space-3) var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-md); font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
    .icons svg { color: var(--text); }
    .shell { height: 300px; display: flex; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-md); }
    .shell .k-sidebar { height: 100%; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .toc { display: none; } }
    @media (max-width: 560px) { .layout, .top__inner { padding-left: var(--space-4); padding-right: var(--space-4); } .stage { padding: var(--space-4); } }
  </style>

    function UploadDemo() {
      var files = useState([]);
      function add(list) {
        var added = list.map(function (f, i) { return { id: Date.now() + '-' + i, name: f.name, size: f.size, progress: 0 }; }), progress = {};
        added.forEach(function (a) { progress[a.id] = 0; });
        files[1](function (cur) { return cur.concat(added); });
        var t = setInterval(function () {
          var done = true;
          added.forEach(function (a) { progress[a.id] = Math.min(1, progress[a.id] + 0.12); if (progress[a.id] < 1) done = false; });
          files[1](function (cur) { return cur.map(function (f) { return progress[f.id] != null ? Object.assign({}, f, { progress: progress[f.id] }) : f; }); });
          if (done) clearInterval(t);
        }, 150);

        var next = cols[0].map(function (c) { return Object.assign({}, c, { items: c.items.slice() }); }), card;

      return h(K.Kanban, { columns: cols[0], onMove: move, onCardClick: function (c) { K.toast('Opened "' + c.title + '"'); } });

      { name: 'Layout', items: [

        { name: 'BarChart', doc: 'BarChart', desc: 'Amounts side by side, or stacked in up to four steps of gray.', demo: function () { return h('div', { className: 'grid2' }, h(K.BarChart, { 'aria-label': 'Tasks', height: 200, series: [{ key: 'done', label: 'Done' }, { key: 'new', label: 'Created' }], data: months.slice(0, 6).map(function (m, i) { return { label: m, done: series[i], new: series[i + 2] }; }) }), h(K.BarChart, { 'aria-label': 'Tasks by status', stacked: true, height: 200, series: [{ key: 'a', label: 'Done' }, { key: 'b', label: 'In progress' }, { key: 'c', label: 'Due soon' }, { key: 'd', label: 'Overdue' }], data: months.slice(0, 6).map(function (m, i) { return { label: m, a: series[i], b: 8 + i, c: 4 + (i % 3), d: 2 + (i % 2) }; }) })); } },
        { name: 'BarList', doc: 'BarList', desc: 'A ranked list where each row is its own bar.', demo: function () { return h(K.BarList, { items: [{ label: 'Website', value: 128 }, { label: 'Mobile app', value: 96 }, { label: 'Design system', value: 71 }] }); } },
        { name: 'Sparkline', doc: 'Sparkline', desc: 'The shape of a trend next to a number, often inside a Stat.', demo: function () { return h('div', { className: 'grid2' }, h(K.Stat, { label: 'Revenue', value: '$48,250', delta: '+12.4%', trend: 'up', caption: 'vs. last month', chart: h(K.Sparkline, { data: series, label: 'Revenue trend' }) })); } },
        { name: 'DonutChart', doc: 'DonutChart', desc: 'Parts of a whole in up to five steps of gray, always with the numbers.', demo: function () { return h(K.DonutChart, { 'aria-label': 'Hours by type', centerLabel: 'Hours', data: [{ label: 'Design', value: 128 }, { label: 'Engineering', value: 96 }, { label: 'Meetings', value: 41 }, { label: 'Writing', value: 23 }, { label: 'Admin', value: 12 }] }); } },
        { name: 'Heatmap', doc: 'Heatmap', desc: 'Activity per day across a year.', demo: function () { return h(K.Heatmap, { 'aria-label': 'Tasks completed', data: heat, format: function (v) { return v + ' tasks'; } }); } }
      ] },
      { name: 'Data display', items: [
        { name: 'Table', doc: 'Table', desc: 'Sort by clicking a header, select rows for bulk actions, hide columns, right-click a row.', demo: function () { return h(K.Table, { selectable: true, columnToggle: true, rowMenu: function () { return menuItems; },
          bulkActions: function (rows) { return h(K.Button, { size: 'sm', variant: 'secondary', icon: 'check', onClick: function () { K.toast.success(rows.length + ' marked as done'); } }, 'Mark as done'); },
          rows: tasks, columns: [{ key: 'name', label: 'Task', strong: true, sortable: true }, { key: 'owner', label: 'Owner', sortable: true }, { key: 'status', label: 'Status', sortable: true, render: function (r) { return h(K.Badge, { tone: tone[r.status] }, r.status); } }, { key: 'hours', label: 'Hours', align: 'right', sortable: true }, { key: 'id', label: 'ID', mono: true, align: 'right' }] }); } },
        { name: 'List', doc: 'List', desc: 'Rows of settings or items, with ListRow.', demo: function () { return h('div', { className: 'narrow' }, h(K.List, { header: 'Settings' }, h(K.ListRow, { icon: 'person', title: 'Profile', subtitle: 'Name and photo', accessory: 'chevron', onClick: function () {} }), h(K.ListRow, { icon: 'bell', title: 'Notifications', value: 'Daily', accessory: 'chevron', onClick: function () {} }))); } },

        { name: 'Badge', doc: 'Badge', desc: 'A short label; colour only with a word.', demo: function () { return h('div', { className: 'row' }, h(K.Badge, null, 'Draft'), h(K.Badge, { tone: 'outline' }, 'Internal'), h(K.Badge, { tone: 'solid' }, 'New'), h(K.Badge, { tone: 'success' }, 'Paid'), h(K.Badge, { tone: 'warning' }, 'Due soon'), h(K.Badge, { tone: 'danger' }, 'Overdue')); } },
        { name: 'Avatar', doc: 'Avatar', desc: 'Initials or a photo, alone or as a group.', demo: function () { return h('div', { className: 'row', style: { gap: 16 } }, h(K.Avatar, { name: 'Ava Thompson', status: 'online' }), h(K.Avatar, { name: 'Noah Bennett', size: 'lg' }), h(K.AvatarGroup, { names: people, max: 4 })); } },
        { name: 'Accordion', doc: 'Accordion', desc: 'Questions and details that open in place.', demo: function () { return h(K.Accordion, { defaultOpen: ['a'], items: [{ id: 'a', title: 'Does Klar work with Next.js?', content: 'Yes, with the App Router.' }, { id: 'b', title: 'Is there an accent colour?', content: 'No. Colour only means status.' }] }); } },
        { name: 'Tooltip', doc: 'Tooltip', desc: 'A short explanation on hover or focus.', demo: function () { return h(K.Tooltip, { content: 'Search', shortcut: '⌘K' }, h(K.Button, { variant: 'ghost', icon: 'search', 'aria-label': 'Search' })); } },
        { name: 'Kbd', doc: 'Kbd', desc: 'A key on the keyboard.', demo: function () { return h('div', { className: 'row' }, 'Press', h(K.Kbd, null, '⌘'), h(K.Kbd, null, 'K')); } },
        { name: 'Icon', doc: 'Icon', desc: 'Line icons on a 24 px grid, always monochrome.', demo: function () { return h('div', { className: 'icons' }, (K.Icon.names || []).map(function (n) { return h('span', { key: n }, h(K.Icon, { name: n, size: 20 }), n); })); } },
        { name: 'Timeline', doc: 'Timeline', desc: 'What happened, in order.', demo: function () { return h(K.Timeline, { items: [{ avatar: 'Mia Larsen', title: h(React.Fragment, null, h('strong', null, 'Mia Larsen'), ' commented'), description: 'Looks good to me.', time: '10 min ago' }, { icon: 'circle-check', title: 'Status set to Done', time: 'Yesterday' }] }); } },
        { name: 'Markdown', doc: 'Markdown', desc: 'Safe markdown with @mentions, rendered as elements.', demo: function () { return h(K.Markdown, { people: people }, '**Decision:** keep the old hero for now.\n\n- Ask @Mia Larsen\n- Ship on _Friday_'); } }
      ] },
      { name: 'Work', items: [
        { name: 'Kanban', doc: 'Kanban', desc: 'Drag cards between columns - or hold on touch, or press Alt and an arrow key.', demo: function () { return h(BoardDemo); } },
        { name: 'Gantt', doc: 'Gantt', desc: 'Projects and tasks over time, with progress and a today line.', demo: function () { return h(K.Gantt, { 'aria-label': 'Plan', items: [
          { id: 1, group: 'Website', label: 'Research', start: iso(-14), end: iso(-4), progress: 1 }, { id: 2, group: 'Website', label: 'Design', start: iso(-6), end: iso(8), progress: 0.5 },
          { id: 3, group: 'Website', label: 'Launch', start: iso(12), milestone: true }, { id: 4, group: 'Mobile app', label: 'Prototype', start: iso(-2), end: iso(16), progress: 0.2 }] }); } },
        { name: 'Stepper', doc: 'Stepper', desc: 'Progress through a short guide.', demo: function () { return h(Toggle, { initial: 1, render: function (v, set) { return h(K.Stepper, { current: v, onStepClick: set, steps: [{ label: 'Details', description: 'Name and goal' }, { label: 'Team', description: 'Who works on it' }, { label: 'Review', description: 'Check and create' }] }); } }); } },
        { name: 'MarkdownEditor', doc: 'MarkdownEditor', desc: 'Notes with bold, lists and links, a preview and @mentions.', demo: function () { return h(K.MarkdownEditor, { label: 'Notes', people: people, rows: 4, defaultValue: 'Type @ to mention someone.' }); } },
        { name: 'CommentThread', doc: 'CommentThread', desc: 'Comments with @mentions. Send with Ctrl or ⌘ and Enter.', demo: function () { return h(CommentsDemo); } }
      ] },
      { name: 'Menus and overlays', items: [
        { name: 'Menu', doc: 'Menu', desc: 'A dropdown of actions with shortcuts, checkmarks and submenus.', demo: function () { return h('div', { className: 'row' }, h(K.Menu, { items: menuItems, trigger: h(K.Button, { variant: 'secondary', iconRight: 'chevron-down' }, 'Options') })); } },
        { name: 'ContextMenu', doc: 'ContextMenu', desc: 'Right-click a card or file for its menu.', demo: function () { return h(K.ContextMenu, { items: menuItems }, h('div', { style: { padding: 32, border: '1px dashed var(--border-strong)', borderRadius: 8, textAlign: 'center', color: 'var(--text-secondary)' } }, 'Right-click here')); } },
        { name: 'Popover', doc: 'Popover', desc: 'A small panel that belongs to a button.', demo: function () { return h(K.Popover, { trigger: h(K.Button, { variant: 'secondary', icon: 'filter' }, 'Filters') }, function (close) { return h('div', { style: { padding: 16, display: 'flex', flexDirection: 'column', gap: 12 } }, h(K.Checkbox, { label: 'Only mine', defaultChecked: true }), h(K.Checkbox, { label: 'Hide done' }), h(K.Button, { size: 'sm', onClick: close }, 'Apply')); }); } },
        { name: 'NotificationInbox', doc: 'NotificationInbox', desc: 'The bell in the topbar and what is behind it.', demo: function () { return h(Toggle, { initial: [{ id: 'a', avatar: 'Mia Larsen', title: 'Mia commented on your task', time: '5 min ago' }, { id: 'b', icon: 'chart', title: 'Your weekly summary is ready', time: 'Monday', read: true }], render: function (v, set) { return h('div', { className: 'row' }, h(K.NotificationInbox, { items: v, onRead: function (id) { set(v.map(function (n) { return n.id === id ? Object.assign({}, n, { read: true }) : n; })); }, onReadAll: function () { set(v.map(function (n) { return Object.assign({}, n, { read: true }); })); } })); } }); } },
        { name: 'Dialog, Modal, Drawer and CommandPalette', doc: 'Modal', desc: 'Overlays take focus, keep Tab inside and give focus back when they close.', demo: function () { return h(OverlayDemo); } }
      ] },
      { name: 'Feedback', items: [
        { name: 'Toast', doc: 'Toast', desc: 'A short confirmation in the corner, with Undo when it makes sense.', demo: function () { return h('div', { className: 'row' }, h(K.Button, { variant: 'secondary', onClick: function () { K.toast.success({ title: 'Task created', description: '"Redesign the landing page" was added.' }); } }, 'Success'), h(K.Button, { variant: 'secondary', onClick: function () { K.toast({ title: 'Project archived', action: h(K.Button, { size: 'sm', variant: 'secondary' }, 'Undo'), duration: 7000 }); } }, 'With undo')); } },
        { name: 'Callout', doc: 'Callout', desc: 'A message that stays on the page.', demo: function () { return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8 } }, h(K.Callout, { tone: 'info', title: 'Follows your system' }, 'Klar uses the system theme until you pick one.'), h(K.Callout, { tone: 'warning', title: 'Your trial ends in 3 days' })); } },
        { name: 'ProgressBar', doc: 'ProgressBar', desc: 'How far something has come.', demo: function () { return h(K.ProgressBar, { value: 0.68, label: 'Progress' }); } },
        { name: 'Skeleton', doc: 'Skeleton', desc: 'The shape of content that is loading.', demo: function () { return h('div', { className: 'row', style: { gap: 12 } }, h(K.Skeleton, { circle: true, width: 36, height: 36 }), h('div', { style: { flex: 1 } }, h(K.Skeleton, { lines: 2 }))); } },
        { name: 'Spinner', doc: 'Spinner', desc: 'Work in progress inside the button that started it.', demo: function () { return h(K.Spinner, { label: 'Saving' }); } },
        { name: 'EmptyState', doc: 'EmptyState', desc: 'Why a page is empty, and the action that fills it.', demo: function () { return h(K.EmptyState, { icon: 'folder', title: 'No projects yet', description: 'Create your first project to start tracking tasks.', action: h(K.Button, { icon: 'plus' }, 'Create project') }); } }
      ] }
    ];

    var count = GROUPS.reduce(function (n, g) { return n + g.items.length; }, 0);
    function slug(name) { return name.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

    function Page() {
      return h(React.Fragment, null,
        h('div', { className: 'intro' },
          h('h1', { className: 'k-h1' }, 'Components'),
          h('p', { className: 'k-body-lg' }, 'Every Klar component, live. Click, type, drag and right-click. Each one links to its guidelines.')),
        GROUPS.map(function (g) {
          return h('section', { key: g.name, className: 'group', id: slug(g.name) },
            h('h2', { className: 'k-overline', style: { color: 'var(--text-secondary)', margin: '0 0 var(--space-4)' } }, g.name),
            g.items.map(function (c) {
              return h('article', { key: c.name, className: 'comp', id: slug(c.name) },
                h('div', { className: 'comp__head' }, h('h3', { className: 'k-h3' }, c.name), h('a', { href: DOCS + c.doc + '.md' }, 'Docs →')),
                h('p', null, c.desc),
                h('div', { className: 'stage' }, c.demo()));
            }));
        }));
    }

    function Toc() {
      var items = [];
      GROUPS.forEach(function (g) { items.push({ section: g.name }); g.items.forEach(function (c) { items.push({ id: slug(c.name), label: c.name }); }); });
      return h(K.NavList, { 'aria-label': 'Components', items: items, defaultValue: '', onChange: function (id) { var el = document.getElementById(id); if (el) el.scrollIntoView(); history.replaceState(null, '', '#' + id); } });
    }

    function Theme() {
      var cur = useState(function () { try { return localStorage.getItem('klar-theme') || 'system'; } catch (e) { return 'system'; } });
      return h(K.SegmentedControl, { 'aria-label': 'Theme', value: cur[0], options: [{ value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }, { value: 'system', label: 'System' }],
        onChange: function (v) { cur[1](v); K.setTheme(v); try { if (v === 'system') localStorage.removeItem('klar-theme'); else localStorage.setItem('klar-theme', v); } catch (e) {} } });
    }

    ReactDOM.createRoot(document.getElementById('main')).render(h(Page));
    ReactDOM.createRoot(document.getElementById('toc')).render(h(Toc));
    ReactDOM.createRoot(document.getElementById('theme')).render(h(Theme));
    ReactDOM.createRoot(document.getElementById('toaster')).render(h(K.Toaster));
    document.title = 'Components · Klar';
    window.__klarComponentCount = count;
  </script>
</body>
