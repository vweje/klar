<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klar · Monochrome design system for React</title>
  <meta name="description" content="Klar is a monochrome design system for React: tokens, 41 components and themes for Tailwind v4 and shadcn/ui.">
  <meta property="og:title" content="Klar">
  <meta property="og:description" content="A monochrome design system for React.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://klar.vweje.dk/">
  <meta property="og:image" content="https://raw.githubusercontent.com/vweje/klar/main/.github/preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2309090b'/%3E%3Cpath d='M11 8v16M21 8l-8 8 8 8' fill='none' stroke='%23fafafa' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // The demo saves the theme picked with its switch; follow it here too.
    try { var saved = localStorage.getItem('klar-theme'); if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../dist/klar.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; }
    main { width: 100%; max-width: 440px; padding: var(--space-6); box-sizing: border-box; }
    h1 { margin: 0; }
    p { margin: var(--space-2) 0 0; color: var(--text-secondary); }
    .install { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-8); font-family: var(--font-mono); font-size: 13px; }
    .install span { color: var(--text-muted); }
    .copy .k-icon + .k-icon, .copy.is-copied .k-icon { display: none; }
    .copy.is-copied .k-icon + .k-icon { display: block; }
    nav { display: flex; gap: var(--space-5); margin-top: var(--space-6); }
    nav a { font-weight: 700; color: var(--text-secondary); text-decoration: none; transition: color 120ms ease; }
    nav a:hover { color: var(--text); }
    a:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 2px; }
  </style>
</head>
<body>
  <main>
    <h1 class="k-h1">Klar</h1>
    <p class="k-body-lg">A monochrome design system for React.</p>
    <div class="install">
      <span aria-hidden="true">$</span>
      <code>npm install github:vweje/klar</code>
      <button type="button" class="k-btn k-btn--ghost k-btn--sm k-btn--icon-only copy" aria-label="Copy install command">
        <svg class="k-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9h11v11H9zM5 15V4h11"/></svg>
        <svg class="k-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
    </div>
    <nav aria-label="Links">
      <a href="../examples/">Demo</a>
      <a href="https://github.com/vweje/klar">GitHub</a>
    </nav>
  </main>

  <script>
    var copyButton = document.querySelector('.copy');
    copyButton.addEventListener('click', function () {
      if (!navigator.clipboard) return;
      navigator.clipboard.writeText(document.querySelector('.install code').textContent).then(function () {
        copyButton.classList.add('is-copied');
        copyButton.setAttribute('aria-label', 'Copied');
        setTimeout(function () { copyButton.classList.remove('is-copied'); copyButton.setAttribute('aria-label', 'Copy install command'); }, 1600);
      });
    });
  </script>
</body>
</html>
